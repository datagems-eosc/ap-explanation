name: Build and Push postgres-provsql Image

on:
  workflow_dispatch:
    inputs:
      pg_major:
        description: "PostgreSQL major version"
        required: true
        default: "17"
      provsql_version:
        description: "ProvSQL version (branch or tag, e.g. v1.8.0)"
        required: true
        default: "v1.8.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/postgres-provsql

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.pg_major }}-${{ inputs.provsql_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PostgreSQL ${{ inputs.pg_major }} with ProvSQL ${{ inputs.provsql_version }}

      - name: Build and push postgres-provsql Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: dependencies/postgres-provsql/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PG_MAJOR=${{ inputs.pg_major }}
            PROVSQL_VERSION=${{ inputs.provsql_version }}
            FIXTURES_PATH=fixtures/postgres-seed
