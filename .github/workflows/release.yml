name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | grep -v "rc" | head -n 1)

          # Extract just the section for this tag from CHANGELOG.md, e.g. the
          # block starting at "## v1.0.0 ..." up to (not including) the next
          # "## " heading. Escape regex metacharacters in the tag so a literal
          # match is used.
          ESCAPED_TAG=$(printf '%s' "$CURRENT_TAG" | sed 's/[.[\*^$/]/\\&/g')

          awk -v tag="$ESCAPED_TAG" '
            $0 ~ "^## " tag "([^0-9.]|$)" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog.md

          if [ ! -s changelog.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${CURRENT_TAG}; falling back to a placeholder body"
            echo "## ${CURRENT_TAG}" > changelog.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> changelog.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}